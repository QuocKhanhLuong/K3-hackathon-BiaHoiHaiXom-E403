[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vlearn-ai-core"
version = "0.1.0"
description = "VLearn AI Core - Pedagogical Learning Loop Orchestration Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vlearn_ai*"]

[tool.pytest.ini_options]
addopts = '-m "not live"'
markers = [
    "live: Opt-in integration tests requiring live OpenAI API key and RUN_LIVE_TESTS=1"
]
